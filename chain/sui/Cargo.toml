[package]
name = "sui-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sui adapter for the allchain unified ChainClient contract (GraphQL)"

[lib]
name = "sui_sdk"
path = "src/lib.rs"

[dependencies]
allchain-core = { workspace = true }
chain-rpcutil = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
blake2 = { workspace = true }
sui-graphql-client = "0.0.7"
# 本地构造 + 签名 SUI 交易所需（与 sign 程序版本对齐）。
sui-sdk-types = { version = "=0.0.7", features = ["serde"] }
ed25519-dalek = "2.2"
bcs = "0.1.6"
base64 = "0.22"
hex = { workspace = true }
