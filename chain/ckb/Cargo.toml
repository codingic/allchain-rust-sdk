[package]
name = "allchain-ckb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Nervos CKB adapter for the allchain unified ChainClient contract (JSON-RPC)"

[lib]
name = "ckb_sdk"
path = "src/lib.rs"

[dependencies]
allchain-core = { workspace = true }
chain-rpcutil = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# 哈希改用 **CKB 官方 crate `ckb-hash`**。
#
# 背景：原来用通用 `blake2` 的 `Blake2bMac::<U20>`，算出的 lock args 与链上不一致。
# CKB 的 blake2b 有两个反直觉约束，通用库极易踩错：
#   1. 必须**无密钥**。`Blake2bMac` 是带密钥变体，即便传空密钥 `&[]`，
#      仍会把一个 128 字节全零块当作密钥块吸收入状态（空密钥 ≠ 无密钥）。
#   2. 输出固定 **32 字节**，blake160 是「取前 20 字节」，而非「直接输出 20 字节」；
#      BLAKE2 把输出长度写进参数块参与运算，故 `blake2b-20(x)` ≠ `blake2b-32(x)[..20]`。
# `ckb-hash` 的 `new_blake2b()` 把这两点封装死了，调用方无法写错。
ckb-hash = "1.1"

# 官方 ckb-sdk：用于**原生 CKB 转账**（live cell 收集 + 容量平衡 + 系统单签锁签名 + 广播）。
# 这是 ckb-sdk 5.1.0 的高层 API（`CapacityTransferBuilder` + `CapacityBalancer` +
# `SecpSighashUnlocker` + `SecpCkbRawKeySigner`），签名路径与链上 secp256k1_blake160
# 校验完全一致，避免手写 witness 签名踩坑。
#
# 注意：本 crate 的 `[lib] name` 也叫 `ckb_sdk`（见文件顶部），与官方包**同名**，
# 直接 `use ckb_sdk::..` 会撞车（rustc E0464）。所以把官方包重命名为
# `official-ckb-sdk` 再引用（见 adapter.rs 的 `use official_ckb_sdk::..`）。
official-ckb-sdk = { package = "ckb-sdk", version = "5.1" }
# 下面这些类型被转账实现直接引用，必须声明为正式依赖。
# 版本必须与 Cargo.lock 里 ckb-sdk 实际依赖的版本**完全一致**，否则会编出多份
# ckb-types / ckb-jsonrpc-types（rustc 报 E0464：同一 crate 出现多个 rlib 候选）。
ckb-types = "=1.1.1"
ckb-jsonrpc-types = "=1.1.1"
# 与 ckb-sdk 5.1.0 依赖的 `secp256k1 0.30.0` 保持同一份，私钥 → 公钥 → SecretKey 类型才能对齐。
secp256k1 = { version = "0.30", features = ["recovery"] }
