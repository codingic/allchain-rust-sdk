[package]
name = "acli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "All-chain unified interface: one CLI / HTTP / MCP entry for eth, btc, sol, near, apt, ar, ckb, fil, sui, ton"

[[bin]]
name = "acli"
path = "src/main.rs"

[dependencies]
allchain-core = { workspace = true }
eth-sdk = { path = "../chain/eth" }
btc-sdk = { path = "../chain/btc" }
sol-sdk = { path = "../chain/sol" }
near-sdk = { path = "../chain/near" }
apt-sdk = { path = "../chain/apt" }
ar-sdk = { path = "../chain/ar" }
allchain-ckb = { path = "../chain/ckb" }
fil-sdk = { path = "../chain/fil" }
sui-sdk = { path = "../chain/sui" }
ton-sdk = { path = "../chain/ton" }
anyhow = { workspace = true }
axum = "0.8"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
