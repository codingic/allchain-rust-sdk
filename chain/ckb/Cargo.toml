[package]
name = "allchain-ckb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Nervos CKB adapter for the allchain unified ChainClient contract (JSON-RPC)"

[lib]
name = "ckb_sdk"
path = "src/lib.rs"

[dependencies]
allchain-core = { workspace = true }
chain-rpcutil = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# 哈希改用 **CKB 官方 crate `ckb-hash`**。
#
# 背景：原来用通用 `blake2` 的 `Blake2bMac::<U20>`，算出的 lock args 与链上不一致。
# CKB 的 blake2b 有两个反直觉约束，通用库极易踩错：
#   1. 必须**无密钥**。`Blake2bMac` 是带密钥变体，即便传空密钥 `&[]`，
#      仍会把一个 128 字节全零块当作密钥块吸收入状态（空密钥 ≠ 无密钥）。
#   2. 输出固定 **32 字节**，blake160 是「取前 20 字节」，而非「直接输出 20 字节」；
#      BLAKE2 把输出长度写进参数块参与运算，故 `blake2b-20(x)` ≠ `blake2b-32(x)[..20]`。
# `ckb-hash` 的 `new_blake2b()` 把这两点封装死了，调用方无法写错。
ckb-hash = "1.1"

# 官方 SDK 只用于**测试**：在 CI 里与 canonical 实现逐字节对拍，
# 确保本 crate 的手写编解码不偏离官方行为。生产构建不引入它。
[dev-dependencies]
# 注意：本 crate 的 `[lib] name` 也叫 `ckb_sdk`（见文件顶部），与官方 crate **同名**，
# 直接 `use ckb_sdk::..` 会撞车（rustc E0464）。所以这里把官方包重命名后再引用。
official-ckb-sdk = { package = "ckb-sdk", version = "5.1" }
# 必须与 Cargo.lock 里 ckb-sdk 依赖的版本**完全一致**，否则会编出两份 ckb-types
# （rustc 报 E0464：同一 crate 出现多个 rlib 候选）。
ckb-types = "=1.1.1"
