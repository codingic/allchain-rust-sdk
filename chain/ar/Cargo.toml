[package]
name = "ar-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Arweave adapter for the allchain unified ChainClient contract (REST)"

[lib]
name = "ar_sdk"
path = "src/lib.rs"

[dependencies]
allchain-core = { workspace = true }
chain-rpcutil = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
arweave-rs = "0.2"
# AR 转账用到 arweave-rs 的签名原语与交易客户端：
# - `jsonwebkey` 把 JWK 私钥字符串解析成密钥（arweave-rs 的依赖，版本对齐避免双份）；
# - `reqwest` 0.11 / `url` 与 arweave-rs 自身依赖同版本，由 cargo 自动合并，不重复编译。
jsonwebkey = "0.3.4"
reqwest = "0.11.20"
url = "2"
# 两段式（无私钥）验签用的 RSA 原语。
# 版本与 arweave-rs 内部依赖的 `rsa 0.6.1` 保持一致，让 cargo 把它们合并成同一份，
# 否则会出现「两个 rsa crate，类型互不认识」的编译错误。
rsa = "0.6.1"
# `PaddingScheme::PSS` 的 `salt_rng` 字段必填，但**验签用不到随机数**；
# 这里只需要一个 `RngCore` 实现占位，`OsRng` 直接读系统熵源、无需播种，
# 比引入 `rand` 全家桶（含 thread_rng / 种子管理）轻得多。
rand_core = "0.6"
