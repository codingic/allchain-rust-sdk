[package]
name = "ton-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "TON adapter for the allchain unified ChainClient contract (toncenter REST)"

[lib]
name = "ton_sdk"
path = "src/lib.rs"

[dependencies]
allchain-core = { workspace = true }
chain-rpcutil = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tonlib-core = "0.26"
# TON 内部转账消息的金额字段是 `num_bigint::BigUint`（tonlib-core 的公开类型），
# 构造 `InternalMessage` 时必须显式引入，否则即便它是传递依赖也无法在源码里引用。
num-bigint = "0.4"
