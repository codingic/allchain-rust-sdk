[package]
name = "fil-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Filecoin adapter for the allchain unified ChainClient contract (JSON-RPC)"

[lib]
name = "fil_sdk"
path = "src/lib.rs"

[dependencies]
allchain-core = { workspace = true }
chain-rpcutil = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
blake2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
fvm_shared = "4.8"
# FIL 原生转账的离线签名所需：
# - k256：secp256k1 可恢复签名（与 fvm_shared 的 verify 走同一套 k256，保证 recovery byte 约定一致）；
# - cid / multihash / fvm_ipld_encoding：构造消息 CID（DAG-CBOR + blake2b-256），
#   签名对象正是 blake2b-256(消息CID) 的 32 字节摘要。
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
cid = "0.11"
multihash = "0.19"
fvm_ipld_encoding = "0.5"
jsonrpsee = { version = "0.26", features = ["client", "http-client", "macros"] }
