[package]
name = "sol-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sol_sdk"
path = "src/lib.rs"

[dependencies]
allchain-core = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
solana-commitment-config = "3.1.1"
solana-hash = "4.5.0"
solana-instruction = "3.4.1"
solana-keypair = "3.1.2"
# `wincode` 必须开：`Message::serialize()`（真正的待签线格式）就门控在它后面，
# 不开则该方法在编译期不存在。
solana-message = { version = "4.4.1", features = ["wincode"] }
solana-pubkey = "4.2.1"
solana-rpc-client = "4.2.1"
solana-rpc-client-types = "4.2.1"
solana-signature = "3.4.1"
solana-signer = "3.0.1"
solana-system-interface = "3.2.0"
# 无私钥构造交易要把 `Transaction` 序列化成字节交出去，这需要 serde 支持。
# 同版本的 serde 实现与线格式一致（ShortVec 的 serde 是照着线格式写的），
# 因此序列化结果能被 ../sign 程序与官方 RPC 同时接受。
solana-transaction = { version = "4.1.6", features = ["serde", "wincode"] }
solana-transaction-status-client-types = "4.2.1"
bincode = "1.3"
hex = { workspace = true }
# 已签名交易在 Solana 生态里惯例以 base64 交换（各钱包适配器与 RPC 都如此），
# 因此 `submit_tx` 需支持 base64 输入。
base64 = { workspace = true }
